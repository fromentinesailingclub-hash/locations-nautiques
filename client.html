<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fromentine Sailing Club — Réservation</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-3 sm:p-6">
  <div class="max-w-md mx-auto space-y-4">
    
    <!-- En-tête -->
    <header class="bg-blue-600 text-white rounded-2xl p-5 shadow-lg text-center space-y-1">
      <h1 class="text-xl font-black">Fromentine Sailing Club</h1>
      <p class="text-blue-100 text-xs">Formulaire de Demande de Location</p>
    </header>

    <!-- Message de confirmation après envoi -->
    <div id="success-screen" class="hidden bg-emerald-600 text-white rounded-2xl p-6 text-center shadow-xl space-y-3">
      <div class="text-4xl">🎉</div>
      <h2 class="text-lg font-black">Demande Envoyée !</h2>
      <p class="text-xs text-emerald-100">Votre demande a bien été transmise à l'équipe du club. Nous la validons d'ici quelques minutes !</p>
      <button onclick="window.location.reload()" class="mt-2 bg-white text-emerald-800 font-bold text-xs px-4 py-2 rounded-xl shadow">Faire une autre demande</button>
    </div>

    <!-- Formulaire Client -->
    <form id="client-form" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
      
      <div class="space-y-3 border-b pb-3">
        <h3 class="font-bold text-xs text-blue-600 uppercase tracking-wider">1. Vos Coordonnées</h3>
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-slate-600 mb-1">Nom *</label>
            <input type="text" id="nom" placeholder="ex: Dupont" class="w-full border rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-blue-500" required>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-600 mb-1">Prénom *</label>
            <input type="text" id="prenom" placeholder="ex: Marc" class="w-full border rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-blue-500" required>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-slate-600 mb-1">Âge *</label>
            <input type="number" id="age" min="10" max="99" placeholder="ex: 35" class="w-full border rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-blue-500" required>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-600 mb-1">Téléphone *</label>
            <input type="tel" id="phone" placeholder="06 12 34 56 78" class="w-full border rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-blue-500" required>
          </div>
        </div>
      </div>

      <div class="space-y-3 border-b pb-3">
        <h3 class="font-bold text-xs text-blue-600 uppercase tracking-wider">2. Date & Créneau souhaité</h3>
        
        <div>
          <label class="block text-[11px] font-bold text-slate-600 mb-1">Date *</label>
          <input type="date" id="date" class="w-full border-2 border-blue-500 bg-blue-50 rounded-xl p-2.5 text-xs font-bold text-blue-900 outline-none" required>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-600 mb-1">Créneau horaire (1 heure) *</label>
          <select id="slot" class="w-full border rounded-xl p-2.5 text-xs font-bold bg-slate-50 outline-none" required></select>
        </div>
      </div>

      <div class="space-y-3 border-b pb-3">
        <h3 class="font-bold text-xs text-blue-600 uppercase tracking-wider">3. Matériels souhaités</h3>
        <div id="equipment-list" class="space-y-2"></div>
      </div>

      <div class="space-y-3">
        <h3 class="font-bold text-xs text-blue-600 uppercase tracking-wider">4. Pratiquants & Urgence</h3>
        
        <div>
          <label class="block text-[11px] font-bold text-slate-600 mb-1">Noms des participants / pratiquants *</label>
          <textarea id="participants" rows="2" placeholder="Saisissez les noms, prénoms et âges des pratiquants..." class="w-full border rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-blue-500" required></textarea>
        </div>

        <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-200">
          <label class="block text-[11px] font-bold text-amber-900 mb-1">🚨 Contact Urgence (Nom + Téléphone) *</label>
          <input type="text" id="emergency" placeholder="ex: Julie 06 99 88 77 66" class="w-full border border-amber-300 rounded-lg p-2 text-xs bg-white outline-none" required>
        </div>
      </div>

      <button type="submit" class="w-full bg-blue-600 active:bg-blue-700 text-white font-black py-4 rounded-xl text-sm uppercase tracking-wider shadow-lg">
        📩 Envoyer ma demande
      </button>
    </form>

  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, addDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyB2c0RYApUY6wmrnJ2QJtqIVE1ZaIRJqPg",
      authDomain: "fromentine-sailing-club.firebaseapp.com",
      projectId: "fromentine-sailing-club",
      storageBucket: "fromentine-sailing-club.firebasestorage.app",
      messagingSenderId: "242231430746",
      appId: "1:242231430746:web:920f676194198d024a5263",
      measurementId: "G-NZ18JKK3PC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const bookingsCol = collection(db, 'bookings');

    const INVENTORY = {
      windsurf: { name: "Windsurf", max: 2, price: 25 },
      kayak_double: { name: "Kayak Double", max: 2, price: 20 },
      kayak_simple: { name: "Kayak Simple", max: 1, price: 15 },
      paddle: { name: "Paddle", max: 5, price: 15 },
      rescue: { name: "Rescue Board", max: 1, price: 15 }
    };

    const SLOTS = [
      "09:00 - 10:00", "09:30 - 10:30", "10:00 - 11:00", "10:30 - 11:30",
      "11:00 - 12:00", "11:30 - 12:30", "12:00 - 13:00", "12:30 - 13:30",
      "13:00 - 14:00", "13:30 - 14:30", "14:00 - 15:00", "14:30 - 15:30",
      "15:00 - 16:00", "15:30 - 16:30", "16:00 - 17:00", "16:30 - 17:30",
      "17:00 - 18:00", "17:30 - 18:30"
    ];

    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    const slotSelect = document.getElementById('slot');
    SLOTS.forEach(s => slotSelect.innerHTML += `<option value="${s}">${s}</option>`);

    const eqContainer = document.getElementById('equipment-list');
    Object.keys(INVENTORY).forEach(key => {
      let opts = '';
      for (let i = 0; i <= INVENTORY[key].max; i++) opts += `<option value="${i}">${i}</option>`;
      eqContainer.innerHTML += `
        <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-200">
          <span class="font-bold text-xs">${INVENTORY[key].name} (${INVENTORY[key].price}€/h)</span>
          <select id="client-qty-${key}" class="border rounded-lg px-3 py-1 font-bold text-xs bg-white">${opts}</select>
        </div>
      `;
    });

    document.getElementById('client-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      let selectedItems = {};
      let totalPrice = 0;
      let totalQty = 0;

      Object.keys(INVENTORY).forEach(key => {
        const qty = parseInt(document.getElementById(`client-qty-${key}`).value) || 0;
        if (qty > 0) {
          selectedItems[key] = qty;
          totalPrice += qty * INVENTORY[key].price;
          totalQty += qty;
        }
      });

      if (totalQty === 0) {
        alert("Veuillez sélectionner au moins un matériel.");
        return;
      }

      const nom = document.getElementById('nom').value.trim();
      const prenom = document.getElementById('prenom').value.trim();
      const age = document.getElementById('age').value.trim();

      await addDoc(bookingsCol, {
        date: document.getElementById('date').value,
        slot: document.getElementById('slot').value,
        respNav: 'En attente validation',
        client: `Demande: ${nom.toUpperCase()} ${prenom}`,
        phone: document.getElementById('phone').value,
        usersNames: `Auteur: ${prenom} (${age} ans) | Participants: ${document.getElementById('participants').value}`,
        emergency: document.getElementById('emergency').value,
        status: 'EN_ATTENTE',
        returned: false,
        items: selectedItems,
        totalPrice: totalPrice,
        createdAt: Date.now()
      });

      document.getElementById('client-form').classList.add('hidden');
      document.getElementById('success-screen').classList.remove('hidden');
    });
  </script>
</body>
</html>
