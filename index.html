<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de Locations Nautiques</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- En-tête -->
    <header class="bg-blue-600 text-white rounded-xl p-6 shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold">Base Nautique — Gestion des Locations</h1>
        <p class="text-blue-100 text-sm">Suivi des créneaux et des disponibilités en temps réel</p>
      </div>
      <div class="flex gap-4 text-center">
        <div class="bg-blue-700 rounded-lg px-4 py-2">
          <span class="block text-xs uppercase tracking-wide text-blue-200">Réservations</span>
          <span id="total-count" class="text-xl font-bold">0</span>
        </div>
        <div class="bg-blue-700 rounded-lg px-4 py-2">
          <span class="block text-xs uppercase tracking-wide text-blue-200">Recettes Est.</span>
          <span id="total-revenue" class="text-xl font-bold">0 €</span>
        </div>
      </div>
    </header>

    <!-- Filtres & Sélection -->
    <section class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
      <div class="flex items-center gap-3">
        <label for="filter-date" class="font-semibold text-slate-700">Date :</label>
        <input type="date" id="filter-date" class="border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div class="flex items-center gap-3">
        <label for="filter-slot" class="font-semibold text-slate-700">Créneau :</label>
        <select id="filter-slot" class="border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></select>
      </div>
    </section>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Formulaire d'ajout -->
      <section class="bg-white rounded-xl p-6 shadow-sm border border-slate-200 lg:col-span-1">
        <h2 class="text-lg font-bold mb-4 text-slate-700">Nouvelle Réservation</h2>
        <form id="booking-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Matériel</label>
            <select id="item-select" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required></select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Quantité</label>
            <input type="number" id="item-qty" min="1" value="1" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
            <span id="stock-warning" class="text-xs text-red-500 hidden mt-1 block"></span>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nom du client</label>
            <input type="text" id="client-name" placeholder="ex: Jean Dupont" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Paiement</label>
            <select id="payment-status" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="Payé">Payé</option>
              <option value="En attente">En attente</option>
            </select>
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition-colors text-sm">
            Valider la réservation
          </button>
        </form>
      </section>

      <!-- Stocks & Liste -->
      <div class="lg:col-span-2 space-y-6">
        
        <!-- Cartes de stock disponible sur le créneau -->
        <section class="bg-white rounded-xl p-6 shadow-sm border border-slate-200">
          <h2 class="text-sm font-bold uppercase text-slate-400 mb-3 tracking-wider">Disponibilités sur ce créneau</h2>
          <div id="stock-cards" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
        </section>

        <!-- Liste des réservations du jour -->
        <section class="bg-white rounded-xl p-6 shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold mb-4 text-slate-700">Planning du jour</h2>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-600">
              <thead class="bg-slate-50 text-slate-400 text-xs uppercase border-b border-slate-200">
                <tr>
                  <th class="py-2 px-3">Créneau</th>
                  <th class="py-2 px-3">Matériel</th>
                  <th class="py-2 px-3">Qté</th>
                  <th class="py-2 px-3">Client</th>
                  <th class="py-2 px-3">Prix</th>
                  <th class="py-2 px-3">Statut</th>
                  <th class="py-2 px-3 text-right">Action</th>
                </tr>
              </thead>
              <tbody id="bookings-table" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </section>

      </div>
    </div>
  </div>

  <script>
    const INVENTORY = {
      windsurf: { name: "Windsurf", max: 2, price: 25 },
      kayak_double: { name: "Kayak Double", max: 2, price: 20 },
      kayak_simple: { name: "Kayak Simple", max: 1, price: 15 },
      paddle: { name: "Paddle", max: 5, price: 15 },
      rescue: { name: "Rescue Board", max: 1, price: 15 }
    };

    const SLOTS = ["09:00 - 10:00", "10:00 - 11:00", "11:00 - 12:00", "12:00 - 13:00", "13:00 - 14:00", "14:00 - 15:00", "15:00 - 16:00", "16:00 - 17:00", "17:00 - 18:00"];

    let bookings = JSON.parse(localStorage.getItem('nautical_bookings')) || [];

    const dateInput = document.getElementById('filter-date');
    const slotSelect = document.getElementById('filter-slot');
    const itemSelect = document.getElementById('item-select');
    const qtyInput = document.getElementById('item-qty');
    const form = document.getElementById('booking-form');

    // Init Date & Slots
    dateInput.value = new Date().toISOString().split('T')[0];
    SLOTS.forEach(slot => {
      slotSelect.innerHTML += `<option value="${slot}">${slot}</option>`;
    });

    Object.keys(INVENTORY).forEach(key => {
      itemSelect.innerHTML += `<option value="${key}">${INVENTORY[key].name} (${INVENTORY[key].price}€/h)</option>`;
    });

    function getAvailableStock(date, slot, itemKey) {
      const used = bookings
        .filter(b => b.date === date && b.slot === slot && b.itemKey === itemKey)
        .reduce((sum, b) => sum + b.qty, 0);
      return INVENTORY[itemKey].max - used;
    }

    function render() {
      const selectedDate = dateInput.value;
      const selectedSlot = slotSelect.value;

      // Stock Cards
      const stockCards = document.getElementById('stock-cards');
      stockCards.innerHTML = '';
      Object.keys(INVENTORY).forEach(key => {
        const avail = getAvailableStock(selectedDate, selectedSlot, key);
        const max = INVENTORY[key].max;
        stockCards.innerHTML += `
          <div class="border border-slate-200 rounded-lg p-3 text-center bg-slate-50">
            <span class="block text-xs font-semibold text-slate-500">${INVENTORY[key].name}</span>
            <span class="text-lg font-bold ${avail === 0 ? 'text-red-500' : 'text-emerald-600'}">${avail} / ${max}</span>
            <span class="block text-[10px] text-slate-400">dispo</span>
          </div>
        `;
      });

      // Table
      const table = document.getElementById('bookings-table');
      table.innerHTML = '';
      const dayBookings = bookings.filter(b => b.date === selectedDate);
      
      let totalRev = 0;
      dayBookings.forEach((b, index) => {
        totalRev += b.price;
        table.innerHTML += `
          <tr>
            <td class="py-2 px-3 text-xs font-semibold">${b.slot}</td>
            <td class="py-2 px-3">${INVENTORY[b.itemKey].name}</td>
            <td class="py-2 px-3">${b.qty}</td>
            <td class="py-2 px-3">${b.client}</td>
            <td class="py-2 px-3 font-medium">${b.price} €</td>
            <td class="py-2 px-3">
              <span class="px-2 py-0.5 text-[10px] font-bold rounded-full ${b.status === 'Payé' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${b.status}</span>
            </td>
            <td class="py-2 px-3 text-right">
              <button onclick="deleteBooking(${b.id})" class="text-red-500 hover:text-red-700 text-xs font-bold">Supprimer</button>
            </td>
          </tr>
        `;
      });

      document.getElementById('total-count').innerText = dayBookings.length;
      document.getElementById('total-revenue').innerText = `${totalRev} €`;
      localStorage.setItem('nautical_bookings', JSON.stringify(bookings));
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const itemKey = itemSelect.value;
      const qty = parseInt(qtyInput.value);
      const avail = getAvailableStock(dateInput.value, slotSelect.value, itemKey);

      if (qty > avail) {
        alert(`Stock insuffisant ! Seul(s) ${avail} ${INVENTORY[itemKey].name} disponible(s) sur ce créneau.`);
        return;
      }

      bookings.push({
        id: Date.now(),
        date: dateInput.value,
        slot: slotSelect.value,
        itemKey: itemKey,
        qty: qty,
        client: document.getElementById('client-name').value,
        status: document.getElementById('payment-status').value,
        price: INVENTORY[itemKey].price * qty
      });

      document.getElementById('client-name').value = '';
      render();
    });

    function deleteBooking(id) {
      bookings = bookings.filter(b => b.id !== id);
      render();
    }

    dateInput.addEventListener('change', render);
    slotSelect.addEventListener('change', render);
    render();
  </script>
</body>
</html>
