<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fromentine Sailing Club — Locations</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-3 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- En-tête -->
    <header class="bg-blue-600 text-white rounded-xl p-5 shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold">Fromentine Sailing Club</h1>
        <p class="text-blue-100 text-sm">Gestion des réservations en temps réel</p>
      </div>
      <div class="flex gap-4 text-center w-full md:w-auto justify-around">
        <div class="bg-blue-700 rounded-lg px-4 py-2 flex-1 md:flex-initial">
          <span class="block text-[10px] uppercase tracking-wide text-blue-200">Réservations</span>
          <span id="total-count" class="text-xl font-bold">0</span>
        </div>
        <div class="bg-blue-700 rounded-lg px-4 py-2 flex-1 md:flex-initial">
          <span class="block text-[10px] uppercase tracking-wide text-blue-200">Recettes Est.</span>
          <span id="total-revenue" class="text-xl font-bold">0 €</span>
        </div>
      </div>
    </header>

    <!-- Navigation Onglets -->
    <div class="flex border-b border-slate-300">
      <button id="tab-day-btn" onclick="switchView('day')" class="py-2 px-4 font-bold border-b-2 border-blue-600 text-blue-600 text-sm">Vue Journée</button>
      <button id="tab-week-btn" onclick="switchView('week')" class="py-2 px-4 font-semibold text-slate-500 hover:text-slate-700 text-sm">Planning Semaine</button>
    </div>

    <!-- Filtres & Sélection -->
    <section id="day-filters" class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <label for="filter-date" class="font-semibold text-slate-700 text-sm">Date :</label>
        <input type="date" id="filter-date" class="border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none w-full sm:w-auto">
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <label for="filter-slot" class="font-semibold text-slate-700 text-sm">Créneau (1h) :</label>
        <select id="filter-slot" class="border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none w-full sm:w-auto"></select>
      </div>
    </section>

    <!-- VUE JOURNÉE -->
    <div id="view-day" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Formulaire d'ajout -->
      <section class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 lg:col-span-1 space-y-4">
        <h2 class="text-lg font-bold text-slate-700">Nouvelle Réservation</h2>
        <form id="booking-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nom du responsable *</label>
            <input type="text" id="client-name" placeholder="ex: Jean Dupont" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">Téléphone client</label>
              <input type="tel" id="client-phone" placeholder="06 12 34 56 78" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">Prénoms pratiquants</label>
              <input type="text" id="users-names" placeholder="ex: Paul, Luc..." class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>

          <div class="bg-amber-50 p-2.5 rounded-lg border border-amber-200">
            <label class="block text-[11px] font-bold text-amber-800 mb-1">Contact d'Urgence (Optionnel)</label>
            <input type="text" id="emergency-contact" placeholder="Nom + N° Téléphone urgence" class="w-full border border-amber-300 rounded p-1.5 text-xs bg-white focus:ring-2 focus:ring-amber-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-2">Matériels à réserver :</label>
            <div id="equipment-selection" class="space-y-3 bg-slate-50 p-3 rounded-lg border border-slate-200"></div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Statut Paiement</label>
            <select id="payment-status" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="Payé">Payé</option>
              <option value="En attente">En attente</option>
            </select>
          </div>

          <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors text-sm shadow">
            Valider la réservation
          </button>
        </form>
      </section>

      <!-- Stocks & Planning -->
      <div class="lg:col-span-2 space-y-6">
        <section class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
          <h2 class="text-xs font-bold uppercase text-slate-400 mb-3 tracking-wider">Disponibilités sur ce créneau</h2>
          <div id="stock-cards" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
        </section>

        <section class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold mb-4 text-slate-700">Planning du jour</h2>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-600">
              <thead class="bg-slate-50 text-slate-400 text-xs uppercase border-b border-slate-200">
                <tr>
                  <th class="py-2 px-3">Créneau</th>
                  <th class="py-2 px-3">Client / Contact</th>
                  <th class="py-2 px-3">Équipements</th>
                  <th class="py-2 px-3">Prix</th>
                  <th class="py-2 px-3">Statut</th>
                  <th class="py-2 px-3 text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="bookings-table" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>

    <!-- VUE SEMAINE -->
    <div id="view-week" class="hidden bg-white rounded-xl p-5 shadow-sm border border-slate-200">
      <h2 class="text-lg font-bold text-slate-700 mb-4">Aperçu du Planning de la Semaine</h2>
      <div id="week-container" class="space-y-4"></div>
    </div>

  </div>

  <!-- MODAL DE MODIFICATION DE RÉSERVATION -->
  <div id="edit-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-slate-800">Modifier la Réservation</h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
      </div>
      
      <form id="edit-form" class="space-y-4">
        <input type="hidden" id="edit-id">

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Créneau horaire</label>
          <select id="edit-slot" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nom du responsable *</label>
          <input type="text" id="edit-client-name" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Téléphone client</label>
            <input type="tel" id="edit-client-phone" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Prénoms pratiquants</label>
            <input type="text" id="edit-users-names" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div class="bg-amber-50 p-2 rounded-lg border border-amber-200">
          <label class="block text-[11px] font-bold text-amber-800 mb-1">Contact d'Urgence</label>
          <input type="text" id="edit-emergency-contact" class="w-full border border-amber-300 rounded p-1.5 text-xs bg-white focus:ring-2 focus:ring-amber-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-2">Quantités d'équipements :</label>
          <div id="edit-equipment-selection" class="space-y-2 bg-slate-50 p-3 rounded-lg border border-slate-200"></div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Statut Paiement</label>
          <select id="edit-payment-status" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="Payé">Payé</option>
            <option value="En attente">En attente</option>
          </select>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeEditModal()" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-lg text-sm">Annuler</button>
          <button type="submit" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm shadow">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Intégration Firebase -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyB2c0RYApUY6wmrnJ2QJtqIVE1ZaIRJqPg",
      authDomain: "fromentine-sailing-club.firebaseapp.com",
      projectId: "fromentine-sailing-club",
      storageBucket: "fromentine-sailing-club.firebasestorage.app",
      messagingSenderId: "242231430746",
      appId: "1:242231430746:web:920f676194198d024a5263",
      measurementId: "G-NZ18JKK3PC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const bookingsCol = collection(db, 'bookings');

    const INVENTORY = {
      windsurf: { name: "Windsurf", max: 2, price: 25 },
      kayak_double: { name: "Kayak Double", max: 2, price: 20 },
      kayak_simple: { name: "Kayak Simple", max: 1, price: 15 },
      paddle: { name: "Paddle", max: 5, price: 15 },
      rescue: { name: "Rescue Board", max: 1, price: 15 }
    };

    const SLOTS = [
      "09:00 - 10:00", "09:30 - 10:30", "10:00 - 11:00", "10:30 - 11:30",
      "11:00 - 12:00", "11:30 - 12:30", "12:00 - 13:00", "12:30 - 13:30",
      "13:00 - 14:00", "13:30 - 14:30", "14:00 - 15:00", "14:30 - 15:30",
      "15:00 - 16:00", "15:30 - 16:30", "16:00 - 17:00", "16:30 - 17:30",
      "17:00 - 18:00", "17:30 - 18:30"
    ];

    let bookings = [];

    const dateInput = document.getElementById('filter-date');
    const slotSelect = document.getElementById('filter-slot');
    const editSlotSelect = document.getElementById('edit-slot');
    const form = document.getElementById('booking-form');
    const editForm = document.getElementById('edit-form');
    const eqContainer = document.getElementById('equipment-selection');
    const editEqContainer = document.getElementById('edit-equipment-selection');

    dateInput.value = new Date().toISOString().split('T')[0];
    
    SLOTS.forEach(slot => {
      slotSelect.innerHTML += `<option value="${slot}">${slot}</option>`;
      editSlotSelect.innerHTML += `<option value="${slot}">${slot}</option>`;
    });

    Object.keys(INVENTORY).forEach(key => {
      let optionsHtml = '';
      for (let i = 0; i <= INVENTORY[key].max; i++) {
        optionsHtml += `<option value="${i}">${i}</option>`;
      }
      eqContainer.innerHTML += `
        <div class="flex justify-between items-center text-xs bg-white p-2 rounded border border-slate-200">
          <div>
            <span class="font-bold text-slate-800 block">${INVENTORY[key].name}</span>
            <span class="text-slate-400 text-[10px]">${INVENTORY[key].price}€/h</span>
          </div>
          <select id="qty-${key}" class="border border-slate-300 rounded px-3 py-1.5 font-bold text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
            ${optionsHtml}
          </select>
        </div>
      `;

      editEqContainer.innerHTML += `
        <div class="flex justify-between items-center text-xs bg-white p-2 rounded border border-slate-200">
          <span class="font-bold text-slate-800">${INVENTORY[key].name}</span>
          <select id="edit-qty-${key}" class="border border-slate-300 rounded px-3 py-1 font-bold text-sm bg-slate-50">
            ${optionsHtml}
          </select>
        </div>
      `;
    });

    onSnapshot(bookingsCol, (snapshot) => {
      bookings = [];
      snapshot.forEach(docSnap => {
        bookings.push({ id: docSnap.id, ...docSnap.data() });
      });
      render();
    });

    function getAvailableStock(date, slot, itemKey, excludeBookingId = null) {
      let used = 0;
      bookings
        .filter(b => b.date === date && b.slot === slot && b.id !== excludeBookingId)
        .forEach(b => {
          if (b.items && b.items[itemKey]) {
            used += b.items[itemKey];
          }
        });
      return INVENTORY[itemKey].max - used;
    }

    window.switchView = function(view) {
      const dayView = document.getElementById('view-day');
      const weekView = document.getElementById('view-week');
      const dayFilters = document.getElementById('day-filters');
      const btnDay = document.getElementById('tab-day-btn');
      const btnWeek = document.getElementById('tab-week-btn');

      if (view === 'day') {
        dayView.classList.remove('hidden');
        dayFilters.classList.remove('hidden');
        weekView.classList.add('hidden');
        btnDay.className = "py-2 px-4 font-bold border-b-2 border-blue-600 text-blue-600 text-sm";
        btnWeek.className = "py-2 px-4 font-semibold text-slate-500 hover:text-slate-700 text-sm";
      } else {
        dayView.classList.add('hidden');
        dayFilters.classList.add('hidden');
        weekView.classList.remove('hidden');
        btnWeek.className = "py-2 px-4 font-bold border-b-2 border-blue-600 text-blue-600 text-sm";
        btnDay.className = "py-2 px-4 font-semibold text-slate-500 hover:text-slate-700 text-sm";
        renderWeek();
      }
    };

    function renderWeek() {
      const weekContainer = document.getElementById('week-container');
      weekContainer.innerHTML = '';

      let curr = new Date(dateInput.value);
      let weekDays = [];
      
      let day = curr.getDay();
      let diff = curr.getDate() - day + (day === 0 ? -6 : 1);
      let monday = new Date(curr.setDate(diff));

      for (let i = 0; i < 7; i++) {
        let d = new Date(monday);
        d.setDate(monday.getDate() + i);
        weekDays.push(d.toISOString().split('T')[0]);
      }

      weekDays.forEach(dateStr => {
        const dayBookings = bookings.filter(b => b.date === dateStr);
        const dayLabel = new Date(dateStr).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'short' });

        let dayHtml = `
          <div class="border border-slate-200 rounded-lg p-3 bg-slate-50">
            <div class="flex justify-between items-center mb-2 border-b border-slate-200 pb-1">
              <h3 class="font-bold capitalize text-sm text-blue-700">${dayLabel}</h3>
              <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2 py-0.5 rounded-full">${dayBookings.length} résa(s)</span>
            </div>
        `;

        if (dayBookings.length === 0) {
          dayHtml += `<p class="text-xs text-slate-400 italic">Aucune réservation</p>`;
        } else {
          dayHtml += `<div class="space-y-1.5">`;
          dayBookings.forEach(b => {
            let itemsSummary = [];
            if (b.items) {
              Object.keys(b.items).forEach(k => {
                if (b.items[k] > 0) itemsSummary.push(`${b.items[k]}x ${INVENTORY[k].name}`);
              });
            }
            dayHtml += `
              <div class="bg-white p-2 rounded border border-slate-200 text-xs flex justify-between items-center">
                <div>
                  <span class="font-bold text-slate-700">${b.slot}</span> — <span class="font-semibold">${b.client}</span>
                  <div class="text-[11px] text-slate-500">${itemsSummary.join(', ')}</div>
                </div>
                <span class="font-bold text-emerald-600">${b.totalPrice}€</span>
              </div>
            `;
          });
          dayHtml += `</div>`;
        }

        dayHtml += `</div>`;
        weekContainer.innerHTML += dayHtml;
      });
    }

    function render() {
      const selectedDate = dateInput.value;
      const selectedSlot = slotSelect.value;

      // Cartes Disponibilités
      const stockCards = document.getElementById('stock-cards');
      stockCards.innerHTML = '';
      Object.keys(INVENTORY).forEach(key => {
        const avail = getAvailableStock(selectedDate, selectedSlot, key);
        const max = INVENTORY[key].max;
        stockCards.innerHTML += `
          <div class="border border-slate-200 rounded-lg p-3 text-center bg-slate-50">
            <span class="block text-xs font-semibold text-slate-500">${INVENTORY[key].name}</span>
            <span class="text-lg font-bold ${avail <= 0 ? 'text-red-500' : 'text-emerald-600'}">${avail} / ${max}</span>
            <span class="block text-[10px] text-slate-400">dispo</span>
          </div>
        `;
      });

      // Tableau du jour
      const table = document.getElementById('bookings-table');
      table.innerHTML = '';
      const dayBookings = bookings.filter(b => b.date === selectedDate);
      
      let totalRev = 0;
      dayBookings.forEach((b) => {
        totalRev += b.totalPrice;
        
        let itemsSummary = [];
        if (b.items) {
          Object.keys(b.items).forEach(k => {
            if (b.items[k] > 0) itemsSummary.push(`${b.items[k]}x ${INVENTORY[k].name}`);
          });
        }

        table.innerHTML += `
          <tr>
            <td class="py-2.5 px-3 text-xs font-semibold">${b.slot}</td>
            <td class="py-2.5 px-3">
              <div class="font-medium text-slate-800">${b.client}</div>
              ${b.phone ? `<a href="tel:${b.phone}" class="text-[11px] text-blue-600 underline block">📞 ${b.phone}</a>` : ''}
              ${b.usersNames ? `<div class="text-[10px] text-slate-500">Pratiquants: ${b.usersNames}</div>` : ''}
              ${b.emergency ? `<div class="text-[10px] text-red-600 font-semibold">🚨 Urgence: ${b.emergency}</div>` : ''}
            </td>
            <td class="py-2.5 px-3 text-xs">${itemsSummary.join(', ')}</td>
            <td class="py-2.5 px-3 font-bold text-slate-700">${b.totalPrice} €</td>
            <td class="py-2.5 px-3">
              <span class="px-2 py-0.5 text-[10px] font-bold rounded-full ${b.status === 'Payé' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${b.status}</span>
            </td>
            <td class="py-2.5 px-3 text-right space-x-2">
              <button data-id="${b.id}" class="edit-btn text-blue-600 hover:text-blue-800 text-xs font-bold">Modifier</button>
              <button data-id="${b.id}" class="delete-btn text-red-500 hover:text-red-700 text-xs font-bold">Supprimer</button>
            </td>
          </tr>
        `;
      });

      document.getElementById('total-count').innerText = dayBookings.length;
      document.getElementById('total-revenue').innerText = `${totalRev} €`;

      // Boutons Modifier & Supprimer
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => openEditModal(e.target.getAttribute('data-id')));
      });

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const docId = e.target.getAttribute('data-id');
          if (confirm("Supprimer cette réservation ?")) {
            await deleteDoc(doc(db, 'bookings', docId));
          }
        });
      });
    }

    // Modal de Modification
    window.openEditModal = function(id) {
      const b = bookings.find(item => item.id === id);
      if (!b) return;

      document.getElementById('edit-id').value = b.id;
      document.getElementById('edit-slot').value = b.slot;
      document.getElementById('edit-client-name').value = b.client || '';
      document.getElementById('edit-client-phone').value = b.phone || '';
      document.getElementById('edit-users-names').value = b.usersNames || '';
      document.getElementById('edit-emergency-contact').value = b.emergency || '';
      document.getElementById('edit-payment-status').value = b.status || 'Payé';

      Object.keys(INVENTORY).forEach(key => {
        const qty = (b.items && b.items[key]) ? b.items[key] : 0;
        document.getElementById(`edit-qty-${key}`).value = qty;
      });

      document.getElementById('edit-modal').classList.remove('hidden');
    };

    window.closeEditModal = function() {
      document.getElementById('edit-modal').classList.add('hidden');
    };

    // Soumission de la modification
    editForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const docId = document.getElementById('edit-id').value;
      const newSlot = document.getElementById('edit-slot').value;
      const currentDate = dateInput.value;

      let selectedItems = {};
      let totalPrice = 0;
      let totalQty = 0;

      for (let key of Object.keys(INVENTORY)) {
        const qty = parseInt(document.getElementById(`edit-qty-${key}`).value) || 0;
        if (qty > 0) {
          const avail = getAvailableStock(currentDate, newSlot, key, docId);
          if (qty > avail) {
            alert(`Stock insuffisant pour ${INVENTORY[key].name} sur le créneau ${newSlot} ! Seul(s) ${avail} disponible(s).`);
            return;
          }
          selectedItems[key] = qty;
          totalPrice += qty * INVENTORY[key].price;
          totalQty += qty;
        }
      }

      if (totalQty === 0) {
        alert("Veuillez sélectionner au moins un matériel.");
        return;
      }

      const bookingRef = doc(db, 'bookings', docId);
      await updateDoc(bookingRef, {
        slot: newSlot,
        client: document.getElementById('edit-client-name').value,
        phone: document.getElementById('edit-client-phone').value || '',
        usersNames: document.getElementById('edit-users-names').value || '',
        emergency: document.getElementById('edit-emergency-contact').value || '',
        status: document.getElementById('edit-payment-status').value,
        items: selectedItems,
        totalPrice: totalPrice
      });

      closeEditModal();
    });

    // Formulaire de création
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const selectedDate = dateInput.value;
      const selectedSlot = slotSelect.value;
      
      let selectedItems = {};
      let totalPrice = 0;
      let totalQty = 0;

      for (let key of Object.keys(INVENTORY)) {
        const qty = parseInt(document.getElementById(`qty-${key}`).value) || 0;
        if (qty > 0) {
          const avail = getAvailableStock(selectedDate, selectedSlot, key);
          if (qty > avail) {
            alert(`Stock insuffisant pour ${INVENTORY[key].name} ! Seul(s) ${avail} disponible(s) sur le créneau ${selectedSlot}.`);
            return;
          }
          selectedItems[key] = qty;
          totalPrice += qty * INVENTORY[key].price;
          totalQty += qty;
        }
      }

      if (totalQty === 0) {
        alert("Veuillez sélectionner au moins un matériel.");
        return;
      }

      await addDoc(bookingsCol, {
        date: selectedDate,
        slot: selectedSlot,
        client: document.getElementById('client-name').value,
        phone: document.getElementById('client-phone').value || '',
        usersNames: document.getElementById('users-names').value || '',
        emergency: document.getElementById('emergency-contact').value || '',
        status: document.getElementById('payment-status').value,
        items: selectedItems,
        totalPrice: totalPrice,
        createdAt: Date.now()
      });

      document.getElementById('client-name').value = '';
      document.getElementById('client-phone').value = '';
      document.getElementById('users-names').value = '';
      document.getElementById('emergency-contact').value = '';
      Object.keys(INVENTORY).forEach(key => {
        document.getElementById(`qty-${key}`).value = 0;
      });
    });

    dateInput.addEventListener('change', () => { render(); renderWeek(); });
    slotSelect.addEventListener('change', render);
  </script>
</body>
</html>
